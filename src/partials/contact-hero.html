<!-- Contact 1 · Hero (quick actions + postmarked gateway photo) -->
<section id="top" class="hero-shell ct-hero" aria-labelledby="hero-title">
  <div class="container-temple ct-hero-grid">
    <div class="ct-hero-copy">
      <nav class="breadcrumb" aria-label="Breadcrumb" data-reveal>
        <ol>
          <li><a href="index.html">Home</a></li>
          <li aria-hidden="true"><svg class="icon icon-dir"><use href="#i-chevron-right"/></svg></li>
          <li><span aria-current="page">Contact</span></li>
        </ol>
      </nav>
      <p class="text-eyebrow-style" data-reveal>Contact</p>
      <h1 id="hero-title" data-reveal style="--reveal-delay:80ms">Write to us, call us or visit</h1>
      <p class="ct-hero-lead" data-reveal style="--reveal-delay:140ms">The Temple Office of {{site.templeName}} is glad to help with visits, poojas, sevas, festivals and anything else you would like to ask.</p>
      <ul class="ct-quick" data-reveal style="--reveal-delay:200ms">
        <li><a href="tel:{{site.phone.href}}"><span class="ct-quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg></span><span class="ct-quick-text"><span>Call</span><strong>{{site.phone.display}}</strong></span></a></li>
        <li><a href="mailto:{{site.email}}"><span class="ct-quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg></span><span class="ct-quick-text"><span>Email</span><strong>{{site.email}}</strong></span></a></li>
        <li><a href="#form"><span class="ct-quick-icon"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></span><span class="ct-quick-text"><span>Write</span><strong>Send an enquiry</strong></span></a></li>
      </ul>
    </div>

    <div class="ct-hero-media" data-reveal="zoom">
      <figure class="ct-hero-photo hm-zoom">
        <img src="assets/img/pages2/contact-hero-1200.jpg" srcset="assets/img/pages2/contact-hero-800.jpg 800w, assets/img/pages2/contact-hero-1200.jpg 1200w" sizes="(min-width: 64rem) 420px, 70vw" width="1200" height="1600" fetchpriority="high" decoding="async" alt="A Kerala temple with a stacked tiled roof standing among tall trees under a blue sky">
      </figure>
      <span class="ct-postmark" aria-hidden="true"><svg class="icon"><use href="#i-mail"/></svg><span>Write<br>to us</span></span>
    </div>
  </div>
</section>
