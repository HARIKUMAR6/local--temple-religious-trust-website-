<header class="site-header" data-header>
  <div class="container-temple header-bar">
    <a class="brand" href="index.html">
      {{> emblem}}
      <span class="brand-text">
        <span class="brand-name">{{site.templeName}}</span>
        <span class="brand-tag">{{site.tagline}}</span>
      </span>
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <ul class="nav-list">
        <li class="has-dropdown" data-dropdown>
          <button type="button" class="nav-link" aria-expanded="false" aria-controls="home-menu" data-dropdown-trigger data-nav-group="home">
            Home
            <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <ul id="home-menu" class="dropdown" data-dropdown-menu hidden>
            <li><a class="dropdown-link" href="index.html" data-nav="index"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-lotus"/></svg>Home 1</a></li>
            <li><a class="dropdown-link" href="home-2.html" data-nav="home-2"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-lotus"/></svg>Home 2</a></li>
          </ul>
        </li>
        <li><a class="nav-link" href="about.html" data-nav="about">About</a></li>
        <li><a class="nav-link" href="pooja-timings.html" data-nav="pooja-timings">Pooja Timings</a></li>
        <li><a class="nav-link" href="donations.html" data-nav="donations">Donations</a></li>
        <li><a class="nav-link" href="contact.html" data-nav="contact">Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Dark theme">
        <svg class="icon when-light" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon when-dark" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
      <button type="button" class="icon-btn" data-dir-toggle aria-pressed="false" aria-label="Right-to-left layout">
        <svg class="icon" aria-hidden="true"><use href="#i-direction"/></svg>
      </button>
      <a class="btn btn-primary btn-sm" href="donations.html">
        <svg class="icon" aria-hidden="true"><use href="#i-heart-hand"/></svg>{{site.donateLabel}}
      </a>
    </div>

    <button type="button" class="icon-btn menu-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu" data-menu-open>
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>
  </div>
</header>
