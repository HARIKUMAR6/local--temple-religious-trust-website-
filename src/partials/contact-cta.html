<!-- Contact 6 · Final contact CTA -->
<section id="visit" class="section-y ct-cta" aria-labelledby="visit-title">
  <div class="container-temple"><div class="ct-cta-inner">
    <span class="ct-cta-seal" aria-hidden="true" data-reveal="zoom"><svg class="icon"><use href="#i-lotus"/></svg></span>
    <h2 id="visit-title" data-reveal style="--reveal-delay:80ms">We look forward to hearing from you</h2>
    <p class="hm-lead" data-reveal style="--reveal-delay:140ms">Whether you wish to visit, to ask about a seva, or to offer your support, the Temple Office of {{site.templeName}} is here to help.</p>
    <div class="hm-cta-row" data-reveal style="--reveal-delay:200ms">
      <a class="btn btn-primary btn-lg" href="tel:{{site.phone.href}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>Call the Temple</a>
      <a class="btn btn-outline btn-lg" href="mailto:{{site.email}}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Email the Office</a>
      <a class="btn btn-outline btn-lg" href="donations.html"><svg class="icon" aria-hidden="true"><use href="#i-heart-hand"/></svg>Support the Temple</a>
    </div>
  </div></div>
</section>
