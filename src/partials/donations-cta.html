<!-- Donations 6 · Contact the temple office (letterhead) -->
<section id="visit" class="section-y dn-cta" aria-labelledby="visit-title">
  <div class="container-temple">
    <div class="dn-letter" data-reveal>
      <figure class="dn-letter-photo hm-zoom"><img src="assets/img/home2/cta-1400.jpg" srcset="assets/img/home2/cta-800.jpg 800w, assets/img/home2/cta-1400.jpg 1400w" sizes="(min-width: 64rem) 860px, 100vw" loading="lazy" decoding="async" alt="Weathered carved stone walls of an old temple in warm evening light"></figure>
      <span class="dn-letter-seal" aria-hidden="true"><svg class="icon"><use href="#i-lotus"/></svg></span>
      <p class="text-eyebrow-style">Temple Office</p>
      <h2 id="visit-title">Speak with the Temple Office</h2>
      <p class="hm-lead">For verified ways to contribute, ask the office directly. They will gladly help.</p>
      <ul class="dn-letter-info">
        <li><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><a href="tel:{{site.phone.href}}">{{site.phone.display}}</a></li>
        <li><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><a href="mailto:{{site.email}}?subject=Donation%20enquiry">{{site.email}}</a></li>
        <li><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span>{{site.officeHours}}</span></li>
      </ul>
      <div class="hm-cta-row">
        <a class="btn btn-primary btn-lg" href="contact.html?topic=donation"><svg class="icon" aria-hidden="true"><use href="#i-heart-hand"/></svg>Contact the Temple Office</a>
        <a class="btn btn-outline btn-lg" href="tel:{{site.phone.href}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>Call Now</a>
      </div>
    </div>
  </div>
</section>
